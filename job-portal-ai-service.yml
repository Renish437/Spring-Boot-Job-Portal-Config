server:
  port: 5007

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  server-url: http://localhost:5000

eureka:
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: http://localhost:8761/eureka/
    instance:
        prefer-ip-address: true
