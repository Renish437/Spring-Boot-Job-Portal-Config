server:
  port: 5007
  address: 0.0.0.0

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

eureka:
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: http://discovery:8761/eureka/
    instance:
        prefer-ip-address: false
        hostname: ai-service
        health-check-url-path: /actuator/health

management:
    endpoints:
        web:
            exposure:
                include: health,info
