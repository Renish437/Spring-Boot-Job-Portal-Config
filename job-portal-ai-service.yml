server:
  port: 5007

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

eureka:
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    instance:
        prefer-ip-address: true
