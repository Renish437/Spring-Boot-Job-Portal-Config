server:
  port: 5005
spring:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql : false
    open-in-view : false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://job-portal-preferencedb:5432/springboot_job_portal_preferencedb
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://job-portal-discovery:8761/eureka/
  instance:
    prefer-ip-address: true


