server:
  port: 5013

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  servers:
    - url: http://localhost:5000
      description: API Gateway

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://walletdb:5432/springboot_job_portal_walletdb}
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
